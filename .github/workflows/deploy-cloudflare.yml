# [INPUT]: 依赖 GitHub Actions、Bun 1.3.5、GitHub Secrets 与 wrangler.jsonc。
# [OUTPUT]: 对 main 分支 push 和手动 workflow_dispatch 提供 Cloudflare Worker 生产部署。
# [POS]: .github/workflows 的发布入口，让 GitHub main 成为 kyo-is Worker 的部署真相源。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy kyo-is
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy
        run: bunx wrangler deploy
