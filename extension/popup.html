<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 300px;
      font-family: 'Lucida Grande', 'Geneva', -apple-system, sans-serif;
      color: #333;
      -webkit-font-smoothing: antialiased;
      background: #fff;
    }

    /* ── 头部：Aqua MenuBar 风格 ── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(248,248,248,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 0.5px solid rgba(0,0,0,0.12);
    }
    .header img { width: 20px; height: 20px; border-radius: 4px; }
    .header span { font-size: 13px; font-weight: 700; color: #333; }

    /* ── 状态区 ── */
    .status {
      padding: 24px 16px 16px;
      text-align: center;
    }
    .status-icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
      font-size: 18px;
      font-weight: 600;
    }
    .status-icon.saved {
      background: rgba(39,101,202,0.12);
      color: rgba(39,101,202,0.88);
    }
    .status-icon.unsaved {
      background: rgba(0,0,0,0.05);
      color: #999;
    }
    .status-title {
      font-size: 14px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 3px;
    }
    .status-desc {
      font-size: 11px;
      color: #999;
    }

    /* ── Aqua 按钮（复刻 themes.css .aqua-button）── */
    .actions {
      padding: 0 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .aqua-btn {
      display: block;
      width: 100%;
      height: 28px;
      padding: 0 16px;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: default;
      text-align: center;
      position: relative;
      overflow: hidden;
      line-height: 1;
      outline: none;
    }
    .aqua-btn span { position: relative; z-index: 3; }

    /* 上高光 */
    .aqua-btn::before {
      content: "";
      position: absolute;
      left: 50%; transform: translateX(-50%);
      top: 2px;
      height: 33%; max-height: 12px;
      width: calc(100% - 10px);
      border-radius: 12px 12px 2px 2px;
      background: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.3));
      filter: blur(0.5px);
      z-index: 2;
      pointer-events: none;
    }
    /* 下高光 */
    .aqua-btn::after {
      content: "";
      position: absolute;
      left: 50%; transform: translateX(-50%);
      bottom: 2px;
      height: 33%;
      width: calc(100% - 8px);
      border-radius: 4px;
      background: linear-gradient(rgba(255,255,255,0), rgba(255,255,255,0.5));
      filter: blur(1px);
      pointer-events: none;
    }

    /* Primary: Aqua 蓝 + 脉冲动画 */
    .aqua-btn.primary {
      background: linear-gradient(
        rgba(0,65,184,0.625),
        rgba(45,115,199,0.625),
        rgba(33,160,196,0.625)
      );
      box-shadow:
        0 2px 3px rgba(0,0,0,0.3),
        0 1px 1px rgba(0,78,187,0.5),
        inset 0 1px 3px rgba(0,17,49,0.8),
        inset 0 2px 3px 1px rgba(0,78,187,0.75);
      color: #000;
      text-shadow: 0 2px 2px rgba(30,77,161,0.5);
      animation: aqua-pulse 1.5s ease-in-out infinite;
    }
    .aqua-btn.primary:hover {
      animation: none;
      filter: brightness(1.12);
    }
    .aqua-btn.primary:active {
      animation: none;
      box-shadow:
        0 2px 3px rgba(0,0,0,0.3),
        0 1px 1px rgba(0,78,187,0.5),
        inset 0 1px 3px rgba(0,17,49,0.8),
        inset 0 2px 3px 1px rgba(0,78,187,0.75),
        0 0 3px rgba(52,106,227,0.5);
    }

    /* Secondary: Aqua 灰 */
    .aqua-btn.secondary {
      background: linear-gradient(rgba(160,160,160,0.625), rgba(255,255,255,0.625));
      box-shadow:
        0 2px 3px rgba(0,0,0,0.2),
        0 1px 1px rgba(0,0,0,0.3),
        inset 0 1px 2px rgba(0,0,0,0.4),
        inset 0 2px 3px 1px #bbb;
      color: #000;
      text-shadow: 0 2px 2px rgba(0,0,0,0.25);
    }
    .aqua-btn.secondary:active {
      box-shadow:
        0 2px 3px rgba(0,0,0,0.2),
        0 1px 1px rgba(0,0,0,0.3),
        inset 0 1px 2px rgba(0,0,0,0.4),
        inset 0 2px 3px 1px #bbb,
        0 0 3px rgba(0,0,0,0.25);
    }

    @keyframes aqua-pulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.12); }
    }

    /* ── 底部 ── */
    .footer {
      padding: 10px 14px;
      border-top: 0.5px solid rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .footer-user {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #666;
    }
    .footer-user img {
      width: 16px; height: 16px;
      border-radius: 50%;
    }
    .footer-sync {
      font-size: 11px;
      color: rgba(39,101,202,0.88);
      margin-left: auto;
    }
    .footer-login {
      font-size: 12px;
      color: rgba(39,101,202,0.88);
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
    }
    .footer-login:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon-128.png" alt="Kyo">
    <span>Kyo</span>
  </div>

  <div class="status" id="status"></div>
  <div class="actions" id="actions"></div>
  <div class="footer" id="footer"></div>

  <script src="popup.js" type="module"></script>
</body>
</html>
